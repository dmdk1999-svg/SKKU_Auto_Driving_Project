[project]
name = "artificial-intelligence-and-control-for-autonomous-driving"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "gymnasium>=1.4.0",
    "sumolib>=1.27.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "traci>=1.27.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
